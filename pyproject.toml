[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptdrift"
version = "0.1.0"
description = "Lightweight drift detection for LLM apps in production"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "promptdrift contributors" }]
keywords = ["llm", "observability", "drift", "monitoring", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
promptdrift = "promptdrift.cli:app"

[project.urls]
Homepage = "https://github.com/pallaprolus/promptdrift"
Issues = "https://github.com/pallaprolus/promptdrift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
